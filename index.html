<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="TypeLab — an offline-friendly typing platform and developer utility suite.">
  <title>TypeLab — typing & tools</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#/typing"><span class="brand-mark">⌨</span><span><strong>TypeLab</strong><small>personal web OS</small></span></a>
      <div class="sidebar-search" id="sidebarSearch"><span>⌕</span><input aria-label="Search tools" placeholder="Search tools"><kbd>⌘K</kbd></div>
      <div class="nav-label">Workspace</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-bottom">
        <button class="nav-button" data-route="settings"><span class="nav-icon">⚙</span>Settings</button>
        <p><b>Local-first by design.</b> Your text, files, and typing history stay in this browser.</p>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><span class="breadcrumb" id="breadcrumb">Typing test</span><div class="top-actions"><button class="button subtle" id="themeButton">◐ theme</button><button class="button accent" id="shareButton">Share view ↗</button></div></header>
      <div id="app"></div>
      <footer>TypeLab is open source · browser-side tools · <button class="link-button" id="exportButton">export data</button></footer>
    </main>
  </div>
  <div class="modal-backdrop hidden" id="paletteBackdrop"><section class="command-palette" role="dialog" aria-modal="true" aria-label="Command palette"><div class="palette-input"><span>⌕</span><input id="paletteInput" autocomplete="off" placeholder="Search tools, modes, and actions..."><kbd>ESC</kbd></div><div class="palette-results" id="paletteResults"></div><div class="palette-help">↑↓ navigate · Enter open · Ctrl K close</div></section></div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <input id="importInput" type="file" accept="application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
